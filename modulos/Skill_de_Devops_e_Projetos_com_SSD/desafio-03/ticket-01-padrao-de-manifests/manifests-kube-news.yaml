# Manifests do kube-news gerados conforme padrão da Metacortex
# Cliente: nyx
# Ambiente: dev (exemplo - substituir por stg ou prod conforme necessário)

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform

---
# ConfigMap para configuração não sensível
apiVersion: v1
kind: ConfigMap
metadata:
  name: nyx-api-config
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    metacortex.io/owner: platform-team
data:
  LOG_LEVEL: "info"
  PORT: "8080"

---
# Secret para credenciais (valor não incluído - deve ser criado separadamente)
apiVersion: v1
kind: Secret
metadata:
  name: nyx-db-secret
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    metacortex.io/owner: platform-team
type: Opaque
stringData:
  # Valores devem ser definidos manualmente ou via processo de provisionamento
  # DB_HOST: "nyx-postgres"
  # DB_DATABASE: "kubedevnews"
  # DB_USERNAME: "kubedevnews"
  # DB_PASSWORD: "<senha-do-banco>"

---
# Deployment do PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-postgres
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    metacortex.io/owner: platform-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-news
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-news
        app.kubernetes.io/instance: nyx-dev
        app.kubernetes.io/part-of: nyx
        app.kubernetes.io/managed-by: platform
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: registry.metacortex.io/postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: nyx-api-config
                  key: DB_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nyx-db-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nyx-db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - kubedevnews
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - kubedevnews
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

---
# Service do PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: nyx-postgres
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    metacortex.io/owner: platform-team
spec:
  selector:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# Deployment da API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    metacortex.io/owner: platform-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-news
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-news
        app.kubernetes.io/instance: nyx-dev
        app.kubernetes.io/part-of: nyx
        app.kubernetes.io/managed-by: platform
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      serviceAccountName: nyx-api
      containers:
        - name: api
          image: registry.metacortex.io/nyx/kube-news:v1
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: nyx-postgres
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: nyx-api-config
                  key: DB_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nyx-db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nyx-db-secret
                  key: DB_PASSWORD
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: nyx-api-config
                  key: PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: nyx-api-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
# Service da API
apiVersion: v1
kind: Service
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    metacortex.io/owner: platform-team
spec:
  selector:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: 8080

---
# ServiceAccount dedicada
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
