name: Prompt Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prompt-tests:
    name: Run promptfoo tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run tests for nota-de-triagem
        run: promptfoo eval -c devops/nota-de-triagem/promptfooconfig.yaml --output-file results/nota-de-triagem.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run tests for triagem-de-pods
        run: promptfoo eval -c devops/triagem-de-pods/promptfooconfig.yaml --output-file results/triagem-de-pods.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run tests for networkpolicy-sentinel
        run: promptfoo eval -c devops/networkpolicy-sentinel/promptfooconfig.yaml --output-file results/networkpolicy-sentinel.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run tests for causa-raiz-cerebro
        run: promptfoo eval -c devops/causa-raiz-cerebro/promptfooconfig.yaml --output-file results/causa-raiz-cerebro.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Comment results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsDir = 'results';

            let comment = '## Prompt Test Results\n\n';

            const prompts = [
              { name: 'nota-de-triagem', file: 'nota-de-triagem.json' },
              { name: 'triagem-de-pods', file: 'triagem-de-pods.json' },
              { name: 'networkpolicy-sentinel', file: 'networkpolicy-sentinel.json' },
              { name: 'causa-raiz-cerebro', file: 'causa-raiz-cerebro.json' }
            ];

            for (const prompt of prompts) {
              const filePath = `${resultsDir}/${prompt.file}`;
              if (fs.existsSync(filePath)) {
                const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                const results = data.results;

                let passCount = 0;
                let failCount = 0;

                for (const result of results) {
                  if (result.success) {
                    passCount++;
                  } else {
                    failCount++;
                  }
                }

                const status = failCount === 0 ? '✅ PASS' : '❌ FAIL';
                comment += `### ${prompt.name}: ${status} (${passCount}/${passCount + failCount})\n\n`;

                if (failCount > 0) {
                  comment += '**Failed tests:**\n';
                  for (const result of results) {
                    if (!result.success) {
                      comment += `- Test: ${result.prompt?.label || result.description}\n`;
                      comment += `  Error: ${result.error || 'Assert failed'}\n\n`;
                    }
                  }
                }
              }
            }

            comment += '\n---\n\n*Generated by promptfoo*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prompt-test-results
          path: results/
